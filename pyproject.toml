[project]
name = "bazaar-contrib-system-service"
version = "0.3.0rc2"
description = "System service management for Bazaar Compute Node"
requires-python = ">=3.15"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
    "bazaar-core~=0.3.0rc13",
    "bazaar-contrib-config~=0.3.0rc13",
    "bazaar-contrib-invoke~=0.3.0rc13",
    "bazaar-contrib-sidecar~=0.3.0rc13",
    "bazaar-contrib-status~=0.3.0rc13",
    "bazaar-contrib-timer~=0.3.0rc13",
    "click>=8.1.0",
    "jinja2>=3.1.0",
]

[project.urls]
Repository = "https://github.com/open-bazaar/contrib-system-service"

[project.entry-points."bazaar_compute_node.contribs"]
system-service = "bazaar_contrib_system_service:commands"
system-service-process = "bazaar_contrib_system_service:process"
system-service-readiness = "bazaar_contrib_system_service:readiness"

[project.entry-points."bazaar_compute_node.commands"]
system-service = "bazaar_contrib_system_service:command_entry"
start = "bazaar_contrib_system_service:start_entry"
stop = "bazaar_contrib_system_service:stop_entry"
restart = "bazaar_contrib_system_service:restart_entry"

[project.entry-points."bazaar_compute_node.remotes"]
system-service = "bazaar_contrib_system_service:process_remote"
system-service-readiness = "bazaar_contrib_system_service:readiness_remote"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = ["bazaar-compute-node>=0.3.0rc13,<0.4", "bazaar-contrib-sidecar-unix~=0.3.0rc11; sys_platform != 'win32'", "bazaar-contrib-sidecar-windows~=0.3.0rc11; sys_platform == 'win32'", "bazaar-contrib-timer-wheel>=0.3.0rc10,<0.4", "ruff>=0.9.0", "pyright==1.1.414", "pytest>=8.3.0", "pytest-asyncio>=0.24.0", "blockbuster>=1.5.29,<1.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:anyio"
asyncio_mode = "auto"
markers = ["system: installs and drives the native service on an isolated CI runner"]

[tool.ruff.lint]
extend-select = ["ASYNC"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.15"
typeCheckingMode = "basic"
